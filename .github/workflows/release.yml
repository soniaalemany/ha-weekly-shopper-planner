name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check manifest version matches the tag
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/weekly_shopper/manifest.json'))['version'])")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version ($version) does not match tag ${GITHUB_REF_NAME}"; exit 1
          fi
      - name: Package integration
        run: cd custom_components/weekly_shopper && zip -r ../../weekly_shopper.zip .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" weekly_shopper.zip --generate-notes --title "$GITHUB_REF_NAME"
